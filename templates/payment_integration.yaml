# =============================================================================
# OmniPM v2.1.0 — 开发型DAG模板：支付集成 | 风险等级：高 | 复杂度：高 | 节点数：10~13 | 门控数：5
# =============================================================================
template:
  id: "payment_integration"
  name: "支付集成服务"
  schema_version: "2.1.0"
  project_type: "开发型"
  risk_level: ["high"]
  complexity: ["high"]
  estimated_nodes: [10, 13]
  description: >
    适用于涉及支付/金融交易的系统集成项目。
    典型场景：第三方支付网关集成（支付宝/微信/Stripe）、订单支付系统、退款/对账系统、数字钱包。
    默认技术栈：RESTful API + PostgreSQL + Redis + 消息队列 + PCI-DSS合规。

  design_dimensions:
    - dimension: "安全设计"
      depth: "DEEP"
      reason: "支付/金融数据触发SF-02，需PCI-DSS合规+交易安全+防欺诈"
    - dimension: "数据架构"
      depth: "DEEP"
      reason: "交易数据强一致性、订单状态机、对账数据模型、审计日志存储"
    - dimension: "合规隐私"
      depth: "DEEP"
      reason: "PCI-DSS合规+金融数据保护+审计追溯"
    - dimension: "性能与伸缩"
      depth: "DEEP"
      reason: "支付链路高可用+峰值流量处理+超时熔断策略"
    - dimension: "可观测性"
      depth: "DEEP"
      reason: "全链路追踪+交易监控+异常告警+审计日志"
    - dimension: "部署运维"
      depth: "STANDARD"
      reason: "多环境密钥管理+灰度发布+灾备方案"
    - dimension: "记忆层/状态管理"
      depth: "STANDARD"
      reason: "分布式事务+幂等性+Redis分布式锁+消息队列"

  nodes:
    - node_id: "req_analysis"
      name: "需求分析"
      node_type: "ANALYSIS"
      domain: "需求管理"
      depends_on: []
      expert_panel:
        - expert: "REQ"
          intensity: "STANDARD"
          focus: "梳理支付场景（支付/退款/对账/分账）、交易状态机、接入的支付渠道、对账周期"
          output_requirement: "输出用户故事地图 + 支付场景清单 + 交易状态机草图 + 支付渠道对接清单"
      success_criteria:
        - "所有支付场景（>=4个）已识别"
        - "交易状态机已建模（>=6个状态）"
        - "支付渠道接口文档已收集"
      estimated_tokens:
        input: 2000
        output: 4000
      max_retries: 3

    - node_id: "meta_gate"
      name: "META-GATE需求确认"
      node_type: "GATE"
      domain: "项目管理"
      depends_on: ["req_analysis"]
      expert_panel:
      success_criteria:
        - "用户确认需求分析结论"
      estimated_tokens:
        input: 500
        output: 500
      max_retries: 3

    - node_id: "api_design"
      name: "支付API契约设计"
      node_type: "DESIGN"
      domain: "API设计"
      depends_on: ["meta_gate"]
      expert_panel:
        - expert: "ARCH"
          intensity: "DEEP"
          focus: "支付API路由设计、幂等键策略、异步通知（Webhook）设计、版本策略"
          output_requirement: "输出OpenAPI 3.0规范 + 支付API设计ADR + 幂等方案"
        - expert: "BE"
          intensity: "STANDARD"
          focus: "支付服务分层、交易状态机实现、支付渠道适配器模式、分布式事务方案（Saga/TCC）"
          output_requirement: "输出模块划分图 + 状态机实现方案 + 支付渠道适配器设计"
      success_criteria:
        - "支付/退款/查询/通知API完整定义"
        - "幂等键机制已设计"
        - "Webhook回调签名验证方案已设计"
        - "分布式事务方案已选定"
      estimated_tokens:
        input: 2500
        output: 6000
      max_retries: 3

    - node_id: "db_design"
      name: "交易数据库设计"
      node_type: "DESIGN"
      domain: "数据库"
      depends_on: ["meta_gate"]
      expert_panel:
        - expert: "DB"
          intensity: "DEEP"
          focus: "交易表/订单表/对账表设计、流水号策略、分库分表预留、数据归档策略"
          output_requirement: "输出DDL + ER图 + 索引策略 + 分片方案 + 数据归档策略"
      success_criteria:
        - "交易核心表完整定义（>=5张）"
        - "流水号生成策略（防重复）已确定"
        - "分库分表预留设计"
        - "数据归档策略已定义"
      estimated_tokens:
        input: 2000
        output: 5000
      max_retries: 3

    - node_id: "security_design"
      name: "支付安全设计"
      node_type: "DESIGN"
      domain: "安全合规"
      depends_on: ["api_design", "db_design"]
      expert_panel:
        - expert: "SEC"
          intensity: "DEEP"
          focus: "PCI-DSS合规清单、支付数据加密（AES-256-GCM）、API签名验证、防重放攻击、Webhook安全、敏感数据脱敏"
          output_requirement: "输出支付安全架构文档 + PCI-DSS合规检查表 + 威胁模型（>=12个场景） + 密钥管理方案"
      success_criteria:
        - "PCI-DSS核心要求逐项有应对方案"
        - "支付数据加密方案（传输+存储）完整"
        - "API签名/防重放机制已设计"
        - "密钥轮转策略已定义"
      estimated_tokens:
        input: 3000
        output: 7000
      max_retries: 3

    - node_id: "security_review"
      name: "支付安全专项评审"
      node_type: "REVIEW"
      domain: "安全合规"
      depends_on: ["security_design"]
      expert_panel:
        - expert: "SEC"
          intensity: "DEEP"
          focus: "逐项审查PCI-DSS合规、交易安全、数据加密、密钥管理、Webhook安全"
          output_requirement: "输出安全评审报告（>=5条建议 + 严重等级 + 修正方案 + PCI-DSS合规状态）"
      success_criteria:
        - "所有P0安全漏洞修正"
        - "PCI-DSS关键项合规确认"
        - "每项安全机制有独立审查结论"
      estimated_tokens:
        input: 2500
        output: 5000
      max_retries: 3

    - node_id: "design_review"
      name: "设计联合评审"
      node_type: "REVIEW"
      domain: "设计评审"
      depends_on: ["security_review"]
      expert_panel:
        - expert: "ARCH"
          intensity: "DEEP"
          focus: "评审支付架构高可用、分布式事务一致性、性能瓶颈"
          output_requirement: "输出>=5条架构建议 + 严重等级"
        - expert: "DB"
          intensity: "DEEP"
          focus: "评审交易数据模型强一致性保障和扩展性"
          output_requirement: "输出>=5条数据层建议 + 严重等级"
        - expert: "BE"
          intensity: "STANDARD"
          focus: "评审支付业务逻辑完备性和异常处理"
          output_requirement: "输出>=3条后端建议 + 严重等级"
      success_criteria:
        - "所有P0/P1问题修正或记录"
        - "每位专家>=最低数量建议"
      estimated_tokens:
        input: 3500
        output: 7000
      max_retries: 3

    - node_id: "gate_design"
      name: "GATE-DESIGN设计确认"
      node_type: "GATE"
      domain: "项目管理"
      depends_on: ["design_review"]
      expert_panel:
      success_criteria:
        - "用户确认设计方案"
      estimated_tokens:
        input: 500
        output: 500
      max_retries: 3

    - node_id: "develop"
      name: "支付服务开发"
      node_type: "DEVELOP"
      domain: "后端开发"
      depends_on: ["gate_design"]
      expert_panel:
        - expert: "BE"
          intensity: "STANDARD"
          focus: "实现支付API、支付渠道适配器、交易状态机、幂等处理、Webhook处理、对账逻辑"
          output_requirement: "输出可运行后端代码 + 单元测试（覆盖率>=85%）"
      success_criteria:
        - "支付/退款/查询/通知API完整实现"
        - "所有支付渠道适配器可独立测试"
        - "状态机转换100%覆盖"
        - "幂等键重复请求正确处理"
      estimated_tokens:
        input: 5000
        output: 12000
      max_retries: 3

    - node_id: "security_test"
      name: "支付安全测试"
      node_type: "TEST"
      domain: "安全合规"
      depends_on: ["develop"]
      expert_panel:
        - expert: "SEC"
          intensity: "DEEP"
          focus: "渗透测试：支付篡改/重放攻击/签名绕过/金额篡改/并发支付/Webhook伪造"
          output_requirement: "输出渗透测试报告 + 漏洞清单 + 修复建议"
        - expert: "QA"
          intensity: "DEEP"
          focus: "测试支付全链路、异常场景（超时/网络中断/重复通知）、对账准确性"
          output_requirement: "输出支付测试用例矩阵（>=20个用例） + 自动化测试脚本"
      success_criteria:
        - "所有OWASP支付风险测试通过"
        - "支付全链路>=20个测试用例"
        - "无P0/P1安全漏洞"
        - "对账逻辑验证通过"
      estimated_tokens:
        input: 3500
        output: 8000
      max_retries: 3

    - node_id: "perf_test"
      name: "性能与压力测试"
      node_type: "TEST"
      domain: "性能优化"
      depends_on: ["security_test"]
      expert_panel:
        - expert: "QA"
          intensity: "DEEP"
          focus: "压力测试：峰值QPS模拟/并发支付/数据库连接池极限/Redis集群压力"
          output_requirement: "输出性能测试报告 + 瓶颈分析 + 扩容建议"
      success_criteria:
        - "支付API P99延迟<1s"
        - "峰值QPS达到预估2倍"
        - "数据库连接池无泄漏"
        - "Redis无内存溢出"
      estimated_tokens:
        input: 2500
        output: 5000
      max_retries: 3

    - node_id: "deliver"
      name: "交付与文档"
      node_type: "DELIVER"
      domain: "项目管理"
      depends_on: ["perf_test"]
      expert_panel:
      success_criteria:
        - "产出API文档 + 支付集成指南"
        - "产出安全架构文档 + PCI-DSS合规报告"
        - "产出PROJECT_MEMORY.md + PROJECT_DECISIONS.md"
        - "产出运维手册（含灾备+监控+告警）"
      estimated_tokens:
        input: 2000
        output: 4000
      max_retries: 3

    - node_id: "gate_acceptance"
      name: "GATE-ACCEPTANCE交付验收"
      node_type: "GATE"
      domain: "项目管理"
      depends_on: ["deliver"]
      expert_panel:
      success_criteria:
        - "用户确认交付物满足需求"
      estimated_tokens:
        input: 500
        output: 500
      max_retries: 3

  edges:
    - edge_id: "e_req_to_gate"
      from: "req_analysis"
      to: "meta_gate"
      condition: "on_success"
      data_flow: "支付场景清单 + 交易状态机 + 渠道清单"
      label: "需求 -> META-GATE"

    - edge_id: "e_gate_to_api"
      from: "meta_gate"
      to: "api_design"
      condition: "on_success"
      data_flow: "确认的需求基线"
      label: "确认 -> API设计"

    - edge_id: "e_gate_to_db"
      from: "meta_gate"
      to: "db_design"
      condition: "on_success"
      data_flow: "确认的需求基线 + 交易实体"
      label: "确认 -> DB设计"

    - edge_id: "e_api_to_sec"
      from: "api_design"
      to: "security_design"
      condition: "on_success"
      data_flow: "支付API规范 + 幂等方案"
      label: "API设计 -> 安全设计"

    - edge_id: "e_db_to_sec"
      from: "db_design"
      to: "security_design"
      condition: "on_success"
      data_flow: "交易表结构 + 流水号策略"
      label: "DB设计 -> 安全设计"

    - edge_id: "e_sec_to_review"
      from: "security_design"
      to: "security_review"
      condition: "on_success"
      data_flow: "支付安全架构 + PCI-DSS清单 + 威胁模型"
      label: "安全设计 -> 安全评审"

    - edge_id: "e_sec_review_to_design"
      from: "security_review"
      to: "design_review"
      condition: "on_success"
      data_flow: "安全评审通过报告"
      label: "安全评审 -> 联合评审"

    - edge_id: "e_review_to_gate"
      from: "design_review"
      to: "gate_design"
      condition: "on_success"
      data_flow: "评审通过的完整设计"
      label: "评审 -> 设计确认"

    - edge_id: "e_gate_to_dev"
      from: "gate_design"
      to: "develop"
      condition: "on_success"
      data_flow: "确认的设计基线"
      label: "确认 -> 开发"

    - edge_id: "e_dev_retry"
      from: "develop"
      to: "develop"
      condition: "on_failure"
      data_flow: "失败原因 + 修正指令"
      label: "开发 自修正"

    - edge_id: "e_dev_to_sec_test"
      from: "develop"
      to: "security_test"
      condition: "on_success"
      data_flow: "支付服务代码"
      label: "开发 -> 安全测试"

    - edge_id: "e_sec_test_retry"
      from: "security_test"
      to: "develop"
      condition: "on_failure"
      data_flow: "安全漏洞报告"
      label: "安全测试失败 -> 开发修正"

    - edge_id: "e_sec_test_to_perf"
      from: "security_test"
      to: "perf_test"
      condition: "on_success"
      data_flow: "安全测试通过报告"
      label: "安全测试 -> 性能测试"

    - edge_id: "e_perf_retry"
      from: "perf_test"
      to: "develop"
      condition: "on_failure"
      data_flow: "性能瓶颈报告"
      label: "性能测试失败 -> 开发优化"

    - edge_id: "e_perf_to_deliver"
      from: "perf_test"
      to: "deliver"
      condition: "on_success"
      data_flow: "测试报告 + 性能基线"
      label: "测试通过 -> 交付"

    - edge_id: "e_deliver_to_gate"
      from: "deliver"
      to: "gate_acceptance"
      condition: "on_success"
      data_flow: "完整交付物"
      label: "交付 -> 验收"

  gates:
    - gate_id: "META_GATE"
      after_node: "req_analysis"
      type: "USER_CONFIRM"
      description: "确认需求分析结论"

    - gate_id: "GATE_SECURITY"
      after_node: "security_review"
      type: "USER_CONFIRM"
      description: "确认支付安全评审结论（高风险强制安全GATE）"

    - gate_id: "GATE_DESIGN"
      after_node: "design_review"
      type: "USER_CONFIRM"
      description: "确认完整设计方案"

    - gate_id: "GATE_TEST"
      after_node: "perf_test"
      type: "AUTO_VERIFY"
      description: "自动验证：安全测试+性能测试全部通过"

    - gate_id: "GATE_ACCEPTANCE"
      after_node: "deliver"
      type: "USER_CONFIRM"
      description: "确认最终交付物满足需求"

  expert_panel_summary:
    - expert: "REQ"
      intensity: "STANDARD"
      reason: "始终激活"
    - expert: "ARCH"
      intensity: "DEEP"
      reason: "高风险支付系统需深度架构评审"
    - expert: "DB"
      intensity: "DEEP"
      reason: "交易数据强一致性+分库分表+归档策略"
    - expert: "BE"
      intensity: "STANDARD"
      reason: "核心支付业务逻辑开发"
    - expert: "SEC"
      intensity: "DEEP"
      reason: "PCI-DSS合规+交易安全，触发SF-02"
    - expert: "QA"
      intensity: "DEEP"
      reason: "高风险需深度安全测试+性能测试"
    - expert: "OPS"
      intensity: "STANDARD"
      reason: "灾备方案+密钥管理+灰度发布"